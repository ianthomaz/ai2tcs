# restart: unless-stopped — containers come back after Docker Desktop / host reboot
# (enable "Open Docker Desktop when you sign in" on the Mac).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_USER: llmapi
      POSTGRES_PASSWORD: llmapi_dev
      POSTGRES_DB: llmapi
    ports:
      - "5437:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmapi"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    # Load llm_api/.env into the container (OLLAMA_*, tokens, etc.). Keys listed below in
    # `environment:` override the same name from .env (e.g. DATABASE_URL must stay @postgres).
    env_file:
      - .env
    ports:
      - "28471:28471"
    # Host Ollama (port 11434): never use 127.0.0.1 inside the container — that loops back to the container.
    # This overrides OLLAMA_HOST from env_file/.env (often 127.0.0.1 for local uvicorn on the host).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: America/Sao_Paulo
      API_HOST: "0.0.0.0"
      API_PORT: "28471"
      DATABASE_URL: "postgresql://llmapi:llmapi_dev@postgres:5432/llmapi"
      LLM_API_TOKEN: "${LLM_API_TOKEN:-dev-token}"
      SESSION_SECRET: "${SESSION_SECRET:-dev-session-secret}"
      OLLAMA_HOST: "http://host.docker.internal:11434"
      # Dashboard Google OAuth (from llm_api/.env; same origin as browser for redirect_uri)
      DASHBOARD_GOOGLE_CLIENT_ID: "${DASHBOARD_GOOGLE_CLIENT_ID:-}"
      DASHBOARD_GOOGLE_CLIENT_SECRET: "${DASHBOARD_GOOGLE_CLIENT_SECRET:-}"
      DASHBOARD_OAUTH_REDIRECT_BASE: "${DASHBOARD_OAUTH_REDIRECT_BASE:-}"
      DASHBOARD_ALLOWED_EMAILS: "${DASHBOARD_ALLOWED_EMAILS:-}"
      DASHBOARD_USER: "${DASHBOARD_USER:-}"
      DASHBOARD_PASSWORD: "${DASHBOARD_PASSWORD:-}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      # Parent folder: all projects visible; each project sends its paths when calling ingest
      - /Users/ianthomaz/Documents/projects:/Users/ianthomaz/Documents/projects:ro
      # RAG library files (e.g. project webplace under llm_api/project_library)
      - ./project_library:/Users/ianthomaz/Documents/projects/ai2tcs/llm_api/project_library:ro

volumes:
  pgdata:
