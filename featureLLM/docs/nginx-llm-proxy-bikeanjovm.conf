# Proxy LLM API: bikeanjovm:28472 -> mini62:28471 (featureLLM)
# Use quando itcsVM não consegue TCP via Tailscale.
# bikeanjovm alcança mini62 (direct); itcsVM alcança bikeanjovm via IP privado (10.0.0.55).
# Clientes (webplacecc no itcsVM) usam LLM_API_URL=http://10.0.0.55:28472
#
# Instalar: sudo cp em /etc/nginx/conf.d/llm-proxy.conf
# Depois: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 28472;
    server_name _;

    location / {
        proxy_pass http://100.90.214.92:28471;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }
}
