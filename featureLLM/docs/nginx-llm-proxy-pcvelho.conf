# Proxy LLM API: pcvelho:28472 -> mini62:28471 (featureLLM)
# Use quando itcsVM não consegue conectar diretamente ao Mac (DERP/TCP).
# Clientes (webplacecc, etc.) usam LLM_API_URL=http://100.89.195.56:28472
#
# Instalar no pcvelho: sudo cp este arquivo em /etc/nginx/conf.d/llm-proxy.conf
# Depois: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 28472;
    server_name _;

    location / {
        proxy_pass http://100.90.214.92:28471;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }
}
