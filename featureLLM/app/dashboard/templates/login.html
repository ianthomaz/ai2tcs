<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LLM Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-sm">
        <h1 class="text-xl font-bold text-blue-400 mb-6 text-center">LLM API Dashboard</h1>
        {% if error %}
        <div class="bg-red-900/50 border border-red-700 text-red-300 px-4 py-2 rounded mb-4 text-sm">
            {{ error }}
        </div>
        {% endif %}
        <form method="post" action="/dashboard/login">
            <label class="block text-sm text-gray-400 mb-2">Usuário</label>
            <input type="text" name="username" required
                   class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500 mb-4"
                   placeholder="Usuário">
            <label class="block text-sm text-gray-400 mb-2">Senha</label>
            <input type="password" name="password" required
                   class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500 mb-4"
                   placeholder="Senha">
            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded transition">
                Entrar
            </button>
        </form>
    </div>
</body>
</html>
