# restart: unless-stopped — containers come back after Docker Desktop / host reboot
# (enable "Open Docker Desktop when you sign in" on the Mac).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_USER: llmapi
      POSTGRES_PASSWORD: llmapi_dev
      POSTGRES_DB: llmapi
    ports:
      - "5437:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmapi"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "28471:28471"
    environment:
      TZ: America/Sao_Paulo
      API_HOST: "0.0.0.0"
      API_PORT: "28471"
      DATABASE_URL: "postgresql://llmapi:llmapi_dev@postgres:5432/llmapi"
      LLM_API_TOKEN: "${LLM_API_TOKEN:-dev-token}"
      SESSION_SECRET: "${SESSION_SECRET:-dev-session-secret}"
      # Ollama runs on host (Mac Mini) - use host.docker.internal or Tailscale IP
      OLLAMA_HOST: "${OLLAMA_HOST:-http://host.docker.internal:11434}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      # Parent folder: all projects visible; each project sends its paths when calling ingest
      - /Users/ianthomaz/Documents/projects:/Users/ianthomaz/Documents/projects:ro
      # RAG library files (e.g. project webplace under featureLLM/project_library)
      - ./project_library:/Users/ianthomaz/Documents/projects/ai2tcs/featureLLM/project_library:ro

volumes:
  pgdata:
