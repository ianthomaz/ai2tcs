# Example: Nginx on an intermediate host proxies :28472 -> llm_api on another host :28471
# Replace upstream with the API host Tailnet address. Adjust listen/client URLs to your layout.
#
# Install: sudo cp to /etc/nginx/conf.d/llm-proxy.conf
# Then: sudo nginx -t && sudo systemctl reload nginx

upstream llm_api_upstream {
    # CHANGE: API host (Tailscale) + 28471
    server 192.0.2.1:28471;
}

server {
    listen 28472;
    server_name _;

    location / {
        proxy_pass http://llm_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }
}
