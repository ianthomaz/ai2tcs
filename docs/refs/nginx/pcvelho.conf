# Example: Nginx on a Tailscale peer proxies :28472 -> API on another peer :28471
# (llm_api). Replace upstream with the real Tailnet IP:port of the host where the API runs.
# Client example: LLM_API_URL=http://<this-proxy-tailnet-ip>:28472
#
# Install on the proxy host: sudo cp this file to /etc/nginx/conf.d/llm-proxy.conf
# Then: sudo nginx -t && sudo systemctl reload nginx

upstream llm_api_upstream {
    # CHANGE: IP/hostname of the API host on Tailscale + 28471
    server 192.0.2.1:28471;
}

server {
    listen 28472;
    server_name _;

    location / {
        proxy_pass http://llm_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }
}
